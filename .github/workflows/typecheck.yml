name: Typecheck

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  typecheck:
    name: npm run typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript ratchet
        run: npm run typecheck
