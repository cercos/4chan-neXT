name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    name: typecheck / test / build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated icon data is up to date
        run: |
          npm run gen:icons
          if ! git diff --exit-code -- src/Icons/icon-data.generated.ts; then
            echo "::error file=src/Icons/icon-data.generated.ts::Generated icon data is stale. Run 'npm run gen:icons' and commit the result."
            exit 1
          fi

      - name: Run TypeScript ratchet
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      # Proves the rollup pipeline (custom plugins included) still produces a
      # bundle; the output goes to the gitignored testbuilds/ and is discarded.
      - name: Verify the bundle builds
        run: npm run testbuild
